# Super Apps - CI/CD pipeline (SDLC-2)
# Template siap-aktivasi. Jalankan setelah repo dipush ke GitHub:
#   Settings > Branches > Branch protection: require status check "security-gate"
#
# Status checks: lint, build, test, SAST (bandit+semgrep), dependency audit (pip-audit+npm audit)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-gate:
    name: Security Gate (SAST + Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep pip-audit
          pip install -r backend/requirements.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Bandit (Python SAST)
        working-directory: backend
        run: bandit -q -r . -x .venv,venv,tests

      - name: Semgrep (Python/JS SAST)
        run: semgrep scan --config auto --quiet --exclude backend/.venv --exclude backend/venv --exclude frontend/node_modules backend frontend

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.lock --desc on

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: SBOM (CycloneDX)
        working-directory: backend
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment .venv/bin/python --output-reproducible --of json -o ../security/sbom/superapps-backend-sbom.json
          cd ../frontend
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-format JSON --output-file ../security/sbom/superapps-frontend-sbom.json --ignore-npm-errors
        continue-on-error: true

  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build
