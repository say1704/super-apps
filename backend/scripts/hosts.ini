# ===========================================
# ANSIBLE INVENTORY - ALL YOUR SERVERS
# ===========================================
# Format: server_name ansible_host=IP_ADDRESS
#
# Usage: ansible-playbook -i hosts.ini setup_sar_ansible.yml
# ===========================================

[all_servers]
# Production Servers
prod-web-01      ansible_host=192.168.1.10
prod-web-02      ansible_host=192.168.1.11
prod-web-03      ansible_host=192.168.1.12
prod-db-01       ansible_host=192.168.1.20
prod-db-02       ansible_host=192.168.1.21

# Development Servers
dev-server-01    ansible_host=192.168.2.10
dev-server-02    ansible_host=192.168.2.11

# Staging Servers
staging-01       ansible_host=192.168.3.10
staging-02       ansible_host=192.168.3.11

# Add your 50-100+ servers here...
# server-name    ansible_host=IP_ADDRESS

# Example for many servers:
# server-001     ansible_host=192.168.10.1
# server-002     ansible_host=192.168.10.2
# server-003     ansible_host=192.168.10.3
# ... (add all your servers)

# ===========================================
# GROUP BY FUNCTION (Optional but Recommended)
# ===========================================
[production]
prod-web-01
prod-web-02
prod-web-03
prod-db-01
prod-db-02

[development]
dev-server-01
dev-server-02

[staging]
staging-01
staging-02

[webservers]
prod-web-01
prod-web-02
prod-web-03
dev-server-01
dev-server-02

[databases]
prod-db-01
prod-db-02

# ===========================================
# GROUP VARIABLES (Optional)
# ===========================================
[all_servers:vars]
# Default SSH settings
ansible_user=root
# ansible_password=your_root_password  # Or use SSH keys
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Override per group if needed
[production:vars]
ansible_user=root

[development:vars]
ansible_user=root
