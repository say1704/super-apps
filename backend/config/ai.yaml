model_path: data/ai/qwen2.5-1.5b-instruct-q4_k_m.gguf
heavy_model_path: data/ai/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf
model_server_url: https://127.0.0.1:8081
embedder_model_path: data/ai/embedder/paraphrase-multilingual-MiniLM-L12-v2
max_input_tokens: 4096
max_output_tokens: 512
embed_confidence: 0.65

# RAG (retrieval dokumen untuk grounding jawaban AI)
rag_top_k: 5            # jumlah potongan teratas yang disuntik ke prompt
rag_min_score: 0.30    # ambang cosine minimum agar potongan dipakai
rag_chunk_tokens: 600  # ukuran chunk saat indexing (kata)
rag_overlap: 80        # tumpang-tindih antar chunk

# Agent Fase 2 (LangGraph autonomous tool-calling)
agent_enabled: true
agent_mode: bounded    # bounded (andal, ~1 panggilan LLM) | deep (autonomous tool-calling, lambat di CPU)
agent_max_steps: 3     # (mode deep) batas langkah/tool-call
agent_timeout_s: 150   # timeout per permintaan → fallback ke RAG
agent_model: light     # sintesis bounded: light=1.5B cepat & selalu termuat; grounding (RAG+data) yang jaga akurasi. (heavy 7B terlalu lambat di CPU → timeout)

# Anomali — knob pengembangan
backup_expected_hour: 21   # jam jadwal backup harian (untuk sinyal backup_missing & suppression jadwal)
backup_grace_hours: 2      # toleransi setelah jadwal sebelum dianggap tidak jalan
forecast_horizon_days: 30  # early-warning kapasitas: flag bila proyeksi capai threshold ≤ N hari
capacity_min_alert_pct: 70 # capacity outlier hanya di-flag bila nilai ≥ ini (buang noise ~1%)
